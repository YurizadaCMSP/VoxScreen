name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Chocolatey (if missing)
        shell: powershell
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Chocolatey..."
            Set-ExecutionPolicy Bypass -Scope Process -Force
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          } else {
            Write-Host "choco already installed"
          }

      - name: Try to install DirectX SDK via Chocolatey (best-effort)
        shell: powershell
        run: |
          $installed = $false
          try {
            choco feature enable -n allowGlobalConfirmation | Out-Null
            choco install directx-sdk -y
            if ($LASTEXITCODE -eq 0) { $installed = $true }
          } catch {
            Write-Warning "choco install directx-sdk raised an exception: $_"
          }
          if (-not $installed) {
            try {
              choco install directx -y
              if ($LASTEXITCODE -eq 0) { $installed = $true }
            } catch {
              Write-Warning "choco install directx raised an exception: $_"
            }
          }
          if ($installed) {
            Write-Host "DirectX package installed via Chocolatey (or reported success)."
          } else {
            Write-Warning "Chocolatey DirectX installs failed or are unavailable on the runner. The build may fail if d3dx9 (legacy D3DX) is required."
          }

      - name: Configure CMake
        shell: powershell
        run: |
          mkdir -Force build
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DCMAKE_BUILD_TYPE=Release

      - name: Build with CMake
        shell: powershell
        run: |
          cmake --build build --config Release --target VoxScreen

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxScreen-artifacts
          path: |
            bin/**/*.asi
            build/**/VoxScreen.* 
            build/**/Release/*.asi
