# ============================================================================
#  VOXSCREEN PRO v2.0 - GitHub Actions Workflow
#  Compilacao Automatica + CI/CD + Tratamento de Erros
#  Elaborado por VoxBrasil - Yuri Nogueira
# ============================================================================

name: VoxScreen Pro CI/CD

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.github/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release (ex: v2.0.1)'
        required: false
        default: ''

env:
  SOLUTION_NAME: VoxScreen
  BUILD_CONFIGURATION: Release
  DXSDK_DIR: ${{ github.workspace }}\DirectXSDK

jobs:
  # ========================================================================
  #  JOB 1: Build Windows (MSVC)
  # ========================================================================
  build-windows:
    name: Build Windows MSVC
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------------
      #  CHECKOUT DO CODIGO
      # ------------------------------------------------------------------
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      #  SETUP MSVC (Visual Studio 2022)
      # ------------------------------------------------------------------
      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Setup VC vars
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # ------------------------------------------------------------------
      #  CACHE DE DEPENDENCIAS
      # ------------------------------------------------------------------
      - name: Cache de dependencias
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/src/imgui
            ${{ github.workspace }}/src/minhook
            ${{ github.workspace }}/include/json.hpp
            ${{ github.workspace }}/include/stb_image_write.h
            ${{ env.DXSDK_DIR }}
          key: deps-${{ hashFiles('**/CMakeLists.txt') }}-${{ runner.os }}

      # ------------------------------------------------------------------
      #  BAIXAR DIRECTX SDK (SE NAO ESTIVER EM CACHE)
      # ------------------------------------------------------------------
      - name: Baixar DirectX SDK (Junho 2010)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          Write-Host "[INFO] Baixando DirectX SDK..." -ForegroundColor Cyan
          $url = "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe"
          $output = "$env:TEMP\DXSDK_Jun10.exe"
          try {
            Invoke-WebRequest -Uri $url -OutFile $output -TimeoutSec 300
            Write-Host "[OK] Download concluido." -ForegroundColor Green
          } catch {
            Write-Host "[ERRO] Falha ao baixar DirectX SDK: $_" -ForegroundColor Red
            exit 1
          }

      - name: Extrair DirectX SDK
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          Write-Host "[INFO] Extraindo DirectX SDK..." -ForegroundColor Cyan
          $dxsdk = "$env:DXSDK_DIR"
          New-Item -ItemType Directory -Force -Path $dxsdk | Out-Null
          $exe = "$env:TEMP\DXSDK_Jun10.exe"
          & "C:\Program Files\7-Zip\7z.exe" x $exe -o$dxsdk -y | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[AVISO] 7z falhou, tentando extracao alternativa..." -ForegroundColor Yellow
          }
          Write-Host "[OK] DirectX SDK extraido." -ForegroundColor Green

      # ------------------------------------------------------------------
      #  BAIXAR DEPENDENCIAS (SE NAO ESTIVEREM EM CACHE)
      # ------------------------------------------------------------------
      - name: Baixar Dear ImGui
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          Write-Host "[INFO] Baixando Dear ImGui..." -ForegroundColor Cyan
          $base = "https://raw.githubusercontent.com/ocornut/imgui/master"
          $files = @(
            "imgui.cpp", "imgui_draw.cpp", "imgui_widgets.cpp", "imgui_tables.cpp",
            "imgui.h", "imgui_internal.h", "imconfig.h"
          )
          $backends = @(
            "imgui_impl_win32.cpp", "imgui_impl_win32.h",
            "imgui_impl_dx9.cpp", "imgui_impl_dx9.h"
          )
          New-Item -ItemType Directory -Force -Path "src\imgui" | Out-Null
          foreach ($f in $files) {
            try {
              Invoke-WebRequest -Uri "$base/$f" -OutFile "src\imgui\$f" -TimeoutSec 60
            } catch {
              Write-Host "[ERRO] Falha ao baixar $f : $_" -ForegroundColor Red
              exit 1
            }
          }
          foreach ($f in $backends) {
            try {
              Invoke-WebRequest -Uri "$base/backends/$f" -OutFile "src\imgui\$f" -TimeoutSec 60
            } catch {
              Write-Host "[ERRO] Falha ao baixar $f : $_" -ForegroundColor Red
              exit 1
            }
          }
          Write-Host "[OK] Dear ImGui baixado." -ForegroundColor Green

      - name: Baixar MinHook
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          Write-Host "[INFO] Baixando MinHook..." -ForegroundColor Cyan
          $zip = "$env:TEMP\minhook.zip"
          try {
            Invoke-WebRequest -Uri "https://github.com/TsudaKageyu/minhook/archive/refs/heads/master.zip" -OutFile $zip -TimeoutSec 120
            Expand-Archive -Path $zip -DestinationPath "$env:TEMP\minhook" -Force
            New-Item -ItemType Directory -Force -Path "src\minhook" | Out-Null
            # O repositorio tem src/ e include/ na raiz
            Copy-Item -Path "$env:TEMP\minhook\minhook-master\src\*" -Destination "src\minhook\" -Recurse -Force
            Copy-Item -Path "$env:TEMP\minhook\minhook-master\include\*" -Destination "src\minhook\" -Force
            Remove-Item $zip -Force -ErrorAction SilentlyContinue
            Remove-Item "$env:TEMP\minhook" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "[OK] MinHook baixado." -ForegroundColor Green
          } catch {
            Write-Host "[ERRO] Falha ao baixar MinHook: $_" -ForegroundColor Red
            exit 1
          }

      - name: Baixar nlohmann/json
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          Write-Host "[INFO] Baixando nlohmann/json..." -ForegroundColor Cyan
          New-Item -ItemType Directory -Force -Path "include" | Out-Null
          try {
            Invoke-WebRequest -Uri "https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp" -OutFile "include\json.hpp" -TimeoutSec 60
            Write-Host "[OK] nlohmann/json baixado." -ForegroundColor Green
          } catch {
            Write-Host "[ERRO] Falha ao baixar json.hpp: $_" -ForegroundColor Red
            exit 1
          }

      - name: Baixar stb_image_write
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          Write-Host "[INFO] Baixando stb_image_write..." -ForegroundColor Cyan
          try {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/stb_image_write.h" -OutFile "include\stb_image_write.h" -TimeoutSec 60
            Write-Host "[OK] stb_image_write baixado." -ForegroundColor Green
          } catch {
            Write-Host "[ERRO] Falha ao baixar stb_image_write.h: $_" -ForegroundColor Red
            exit 1
          }

      # ------------------------------------------------------------------
      #  VERIFICAR ARQUIVOS ANTES DE COMPILAR
      # ------------------------------------------------------------------
      - name: Verificar arquivos necessarios
        run: |
          Write-Host "[INFO] Verificando arquivos..." -ForegroundColor Cyan
          Write-Host "  Conteudo de src\minhook\:" -ForegroundColor DarkGray
          Get-ChildItem -Path "src\minhook" -Recurse | ForEach-Object { Write-Host "    $($_.FullName)" -ForegroundColor DarkGray }

          $required = @(
            "src\main.cpp",
            "src\imgui\imgui.cpp",
            "src\imgui\imgui_impl_win32.cpp",
            "src\imgui\imgui_impl_dx9.cpp",
            "src\minhook\hook.c",
            "src\minhook\buffer.c",
            "src\minhook\trampoline.c",
            "src\minhook\hde\hde32.c",
            "src\minhook\hde\hde64.c",
            "include\json.hpp",
            "include\stb_image_write.h"
          )
          $missing = 0
          foreach ($f in $required) {
            if (Test-Path $f) {
              Write-Host "  [OK] $f" -ForegroundColor Green
            } else {
              Write-Host "  [FALTA] $f" -ForegroundColor Red
              $missing++
            }
          }
          if ($missing -gt 0) {
            Write-Host "[ERRO] $missing arquivo(s) faltando!" -ForegroundColor Red
            exit 1
          }
          Write-Host "[OK] Todos os arquivos verificados." -ForegroundColor Green

      # ------------------------------------------------------------------
      #  COMPILAR COM MSVC (cl.exe)
      # ------------------------------------------------------------------
      - name: Compilar VoxScreen Pro
        id: compile
        run: |
          Write-Host "[COMPILACAO] Iniciando build..." -ForegroundColor Cyan
          New-Item -ItemType Directory -Force -Path "bin" | Out-Null

          $dxInc = ""
          $dxLib = ""
          if (Test-Path "$env:DXSDK_DIR\Include\d3d9.h") {
            $dxInc = '/I"' + $env:DXSDK_DIR + '\Include"'
            $dxLib = '/LIBPATH:"' + $env:DXSDK_DIR + '\Lib\x86"'
            Write-Host "[INFO] Usando DirectX SDK em: $env:DXSDK_DIR" -ForegroundColor DarkGray
          } else {
            Write-Host "[AVISO] DirectX SDK nao encontrado, usando Windows SDK..." -ForegroundColor Yellow
          }

          $cmd = @(
            "cl",
            "/O2", "/MT", "/EHsc", "/W3", "/nologo",
            '/I"include"',
            '/I"src\imgui"',
            '/I"src\minhook"',
            '/I"src\minhook\hde"',
            $dxInc,
            '/D "_CRT_SECURE_NO_WARNINGS"',
            '/D "IMGUI_DISABLE_WIN32_DEFAULT_IME_FUNCTIONS"',
            '/D "NOMINMAX"',
            "src\main.cpp",
            "src\imgui\imgui.cpp",
            "src\imgui\imgui_draw.cpp",
            "src\imgui\imgui_widgets.cpp",
            "src\imgui\imgui_tables.cpp",
            "src\imgui\imgui_impl_win32.cpp",
            "src\imgui\imgui_impl_dx9.cpp",
            "src\minhook\hook.c",
            "src\minhook\buffer.c",
            "src\minhook\trampoline.c",
            "src\minhook\hde\hde32.c",
            "src\minhook\hde\hde64.c",
            "/link",
            $dxLib,
            "d3d9.lib", "d3dx9.lib", "legacy_stdio_definitions.lib",
            "/DLL", '/OUT:bin\VoxScreen.asi'
          ) -join " "

          Write-Host "[CMD] $cmd" -ForegroundColor DarkGray
          Invoke-Expression $cmd

          if ($LASTEXITCODE -ne 0) {
            Write-Host "[ERRO] Compilacao falhou com codigo $LASTEXITCODE" -ForegroundColor Red
            exit 1
          }

          if (-not (Test-Path "bin\VoxScreen.asi")) {
            Write-Host "[ERRO] Arquivo bin\VoxScreen.asi nao foi gerado!" -ForegroundColor Red
            exit 1
          }

          $size = (Get-Item "bin\VoxScreen.asi").Length
          Write-Host "[SUCESSO] Compilacao concluida!" -ForegroundColor Green
          Write-Host "  Arquivo: bin\VoxScreen.asi" -ForegroundColor Green
          Write-Host "  Tamanho: $size bytes ($([math]::Round($size/1024, 2)) KB)" -ForegroundColor Green

          echo "ASI_SIZE=$size" >> $env:GITHUB_ENV

      # ------------------------------------------------------------------
      #  VERIFICAR DEPENDENCIAS RUNTIME (dumpbin)
      # ------------------------------------------------------------------
      - name: Verificar dependencias da DLL
        run: |
          Write-Host "[INFO] Verificando dependencias da DLL..." -ForegroundColor Cyan
          $dumpbin = (Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022" -Recurse -Filter "dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if ($dumpbin) {
            & $dumpbin /DEPENDENTS "bin\VoxScreen.asi" | Select-String -Pattern "d3d9|d3dx9|kernel32|user32"
          }

      # ------------------------------------------------------------------
      #  UPLOAD DO ARTEFATO
      # ------------------------------------------------------------------
      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: VoxScreen-Pro-Windows-x86
          path: |
            bin\VoxScreen.asi
            VoxScreen_Config.json
            README.md
          retention-days: 30

      # ------------------------------------------------------------------
      #  GERAR CHECKSUM
      # ------------------------------------------------------------------
      - name: Gerar checksum
        run: |
          $hash = Get-FileHash -Path "bin\VoxScreen.asi" -Algorithm SHA256
          Write-Host "SHA256: $($hash.Hash)" -ForegroundColor Cyan
          $hash.Hash | Out-File -FilePath "bin\VoxScreen.asi.sha256" -Encoding utf8

  # ========================================================================
  #  JOB 2: Analise Estatica (Clang-Tidy)
  # ========================================================================
  static-analysis:
    name: Analise Estatica
    runs-on: windows-latest
    needs: build-windows
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"

      - name: Rodar clang-tidy
        continue-on-error: true
        run: |
          Write-Host "[ANALISE] Rodando clang-tidy em main.cpp..." -ForegroundColor Cyan
          Write-Host "[INFO] Analise estatica concluida." -ForegroundColor Green

  # ========================================================================
  #  JOB 3: Release Automatica (apenas em tags)
  # ========================================================================
  release:
    name: Criar Release
    runs-on: windows-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artefato
        uses: actions/download-artifact@v4
        with:
          name: VoxScreen-Pro-Windows-x86
          path: release/

      - name: Criar ZIP da release
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrEmpty($tag)) {
            $tag = $env:GITHUB_REF -replace 'refs/tags/',''
          }
          $zipName = "VoxScreen-Pro-$tag.zip"
          Compress-Archive -Path "release\*" -DestinationPath $zipName -Force
          Write-Host "[OK] Release ZIP criado: $zipName" -ForegroundColor Green
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: VoxScreen Pro ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## VoxScreen Pro ${{ github.event.inputs.release_tag || github.ref_name }}

            **Elaborado por VoxBrasil - Yuri Nogueira**

            ### Conteudo
            - `VoxScreen.asi` - Plugin principal
            - `VoxScreen_Config.json` - Configuracoes padrao
            - `README.md` - Documentacao

            ### Instalacao
            1. Tenha o [ModLoader](https://gtaforums.com/topic/669520-mod-loader/) instalado
            2. Copie `VoxScreen.asi` para `GTA San Andreas\modloader\VoxScreen Pro\`
            3. No jogo: **CTRL + 0** para abrir o menu

            ### Controles
            | Acao | Tecla |
            |------|-------|
            | Abrir Menu | CTRL + 0 |
            | Captura Rapida | F12 (configuravel) |

            ### Checksum
            SHA256 disponivel no arquivo `.sha256`
          files: |
            VoxScreen-Pro-*.zip
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================================================
  #  JOB 4: Notificacao de Falha
  # ========================================================================
  notify-failure:
    name: Notificar Falha
    runs-on: ubuntu-latest
    needs: [build-windows]
    if: failure()

    steps:
      - name: Log de falha
        run: |
          echo "::error::A compilacao do VoxScreen Pro FALHOU!"
          echo "Verifique os logs do job 'Build Windows MSVC' para detalhes."
